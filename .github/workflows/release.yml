name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Multi-OS Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi

          echo "Building binaries for release: $TAG"

          targets=(
            "windows/amd64/mcp-skill-auditor-windows-amd64.exe"
            "windows/arm64/mcp-skill-auditor-windows-arm64.exe"
            "linux/amd64/mcp-skill-auditor-linux-amd64"
            "linux/arm64/mcp-skill-auditor-linux-arm64"
            "darwin/amd64/mcp-skill-auditor-darwin-amd64"
            "darwin/arm64/mcp-skill-auditor-darwin-arm64"
          )

          for target in "${targets[@]}"; do
            IFS="/" read -r os arch filename <<< "$target"
            echo "-> Compiling $filename ($os/$arch)..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/$filename" ./cmd/auditor
          done

      - name: Generate SHA-256 Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Binaries as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-skill-auditor-binaries
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "mcp-skill-auditor ${{ github.ref_name }}" \
            --generate-notes
